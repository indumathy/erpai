spring:
  application:
    name: erpai
  datasource:
    url: jdbc:postgresql://localhost:5432/erpai
    username: vacos
    password: vacos
  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) logs; key/values added via SLF4J's
      # fluent API (e.g. invoiceId) become searchable fields.
      console: ecs
